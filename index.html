<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>英语单选闯关</title>
<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container" id="app-container">
  <div id="loading">
    <div class="spinner"></div>
    <p>正在加载数据...</p>
  </div>

  <!-- Student: Select -->
  <div id="screen-select" class="screen">
    <div class="hero">
      <h1>📝 英语单选闯关</h1>
      <p>选择你的班级和姓名，开始答题吧！</p>
    </div>
    <div class="card">
      <label class="select-label">选择班级</label>
      <div class="select-wrap">
        <select id="sel-class"><option value="">请选择班级</option></select>
      </div>
      <label class="select-label">选择姓名</label>
      <div class="select-wrap">
        <select id="sel-name" disabled><option value="">请先选择班级</option></select>
      </div>
      <label class="select-label">选择题量</label>
      <div class="chip-group" id="chip-group"></div>
      <div class="total-info" id="total-info"></div>
      <button class="btn btn-primary" id="btn-start" disabled>开始闯关 🚀</button>
    </div>
    <div style="text-align:center;margin-top:12px;">
      <button class="btn-ghost" id="btn-view-rank">🏆 查看排行榜</button>
    </div>
    <div style="margin-top:16px;border-top:1px dashed #e2e8f0;padding-top:12px;">
      <details style="font-size:0.85em;color:#fff;background:rgba(255,255,255,0.12);border-radius:8px;padding:10px 14px;">
        <summary style="cursor:pointer;color:#fff;font-weight:bold;font-size:0.9em;">⚙️ 自定义 API 地址（点此展开）</summary>
        <div style="margin-top:10px;display:flex;flex-direction:column;gap:8px;">
          <div>
            <label style="font-size:0.82em;color:#fff;font-weight:bold;display:block;margin-bottom:3px;">班级花名册</label>
            <input id="cfg-students" placeholder="https://quickform.cn/api/5j9aayuuzl" style="width:100%;padding:8px 10px;border:1px solid rgba(255,255,255,0.3);border-radius:6px;font-size:0.8em;background:rgba(255,255,255,0.95);color:#333;">
          </div>
          <div>
            <label style="font-size:0.82em;color:#fff;font-weight:bold;display:block;margin-bottom:3px;">每周单选题</label>
            <input id="cfg-questions" placeholder="https://quickform.cn/api/uzubqztmvc" style="width:100%;padding:8px 10px;border:1px solid rgba(255,255,255,0.3);border-radius:6px;font-size:0.8em;background:rgba(255,255,255,0.95);color:#333;">
          </div>
          <div>
            <label style="font-size:0.82em;color:#fff;font-weight:bold;display:block;margin-bottom:3px;">做题记录</label>
            <input id="cfg-records" placeholder="https://quickform.cn/api/9x9k35vdah" style="width:100%;padding:8px 10px;border:1px solid rgba(255,255,255,0.3);border-radius:6px;font-size:0.8em;background:rgba(255,255,255,0.95);color:#333;">
          </div>
          <button onclick="saveApiConfig()" style="padding:8px 16px;background:#fff;color:#667eea;border:none;border-radius:6px;cursor:pointer;font-size:0.85em;font-weight:bold;">保存 API 地址</button>
          <span id="cfg-msg" style="font-size:0.8em;color:#c6f6d5;font-weight:bold;display:none;">✓ 已保存</span>
        </div>
      </details>
    </div>
  </div>

  <!-- Student: Quiz -->
  <div id="screen-quiz" class="screen">
    <div class="timer" id="timer">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.4 0-8-3.6-8-8s3.6-8 8-8 8 3.6 8 8-3.6 8-8 8zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7V7z"/></svg>
      <span id="timer-text">00:00</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-text">
      <span id="progress-label">第 1 题</span>
      <span id="progress-count">0 / 0</span>
    </div>
    <div class="card" id="quiz-card">
      <span class="question-num" id="q-num">第1题</span>
      <div class="question-text" id="q-text"></div>
      <div id="q-options"></div>
      <div class="explanation" id="q-explanation"></div>
      <div class="next-btn-wrap" id="next-wrap" style="display:none;">
        <button class="btn btn-primary" id="btn-next">下一题 →</button>
      </div>
    </div>
  </div>

  <!-- Student: Result -->
  <div id="screen-result" class="screen">
    <div class="result-header">
      <h2 id="result-greeting">🎉 闯关完成！</h2>
      <p id="result-player"></p>
    </div>
    <div class="card" style="text-align:center;">
      <div class="result-circle">
        <svg width="140" height="140">
          <circle cx="70" cy="70" r="62" fill="none" stroke="#E5E7EB" stroke-width="8"/>
          <circle cx="70" cy="70" r="62" fill="none" stroke="#4F46E5" stroke-width="8"
            stroke-dasharray="389.56" stroke-dashoffset="389.56" stroke-linecap="round" id="score-ring"/>
        </svg>
        <span class="score-num" id="score-num">0</span>
        <span class="score-label">正确率</span>
      </div>
      <div class="stat-grid">
        <div class="stat-item blue"><div class="num" id="stat-total">0</div><div class="label">总题数</div></div>
        <div class="stat-item green"><div class="num" id="stat-correct">0</div><div class="label">答对</div></div>
        <div class="stat-item red"><div class="num" id="stat-wrong">0</div><div class="label">答错</div></div>
      </div>
      <div class="stat-grid">
        <div class="stat-item"><div class="num" id="stat-time" style="font-size:18px;color:var(--gray-700);">-</div><div class="label">用时</div></div>
        <div class="stat-item"><div class="num" id="stat-avg" style="font-size:18px;color:var(--gray-700);">-</div><div class="label">平均每题</div></div>
        <div class="stat-item"><div class="num" id="stat-rank" style="font-size:18px;color:var(--warning);">-</div><div class="label">排名</div></div>
      </div>
    </div>
    <div id="wrong-section"></div>
    <div class="card">
      <button class="btn btn-primary" id="btn-ranking">🏆 查看排行榜</button>
      <button class="btn btn-outline" id="btn-retry">再来一次 🔄</button>
    </div>
  </div>

  <!-- Ranking -->
  <div id="screen-ranking" class="screen">
    <div class="hero" style="padding:30px 20px 20px;">
      <h1>🏆 排行榜</h1>
      <p id="rank-update-time"></p>
    </div>
    <div class="card">
      <div class="rank-tabs" id="rank-tabs"></div>
      <div id="rank-list"></div>
    </div>
    <div style="padding:12px 0;">
      <button class="btn-ghost" style="width:100%;" id="btn-back">← 返回</button>
    </div>
  </div>

  <!-- Teacher Dashboard -->
  <div id="screen-teacher" class="screen">
    <div class="teacher-hero">
      <h1>📊 教师数据看板</h1>
      <p>查看学生答题情况，导出学情数据</p>
    </div>
    <div class="teacher-stats" id="teacher-stats"></div>

    <!-- Tab nav -->
    <div class="card" style="padding:8px !important;margin-bottom:0;border-radius:var(--radius) var(--radius) 0 0;">
      <div style="display:flex;gap:4px;overflow-x:auto;">
        <button class="t-nav-tab active" data-tab="students" onclick="switchTeacherTab('students')">👥 数据</button>
        <button class="t-nav-tab" data-tab="errors" onclick="switchTeacherTab('errors')">❌ 易错题</button>
        <button class="t-nav-tab" data-tab="qmgmt" onclick="switchTeacherTab('qmgmt')">📝 题库</button>
        <button class="t-nav-tab" data-tab="cmgmt" onclick="switchTeacherTab('cmgmt')">🏫 班级</button>
        <button class="t-nav-tab" data-tab="import" onclick="switchTeacherTab('import')">📥 导入</button>
      </div>
    </div>

    <!-- Tab: Students -->
    <div class="card t-tab-panel active" id="tab-students" style="border-radius:0 0 var(--radius) var(--radius);margin-top:0;">
      <!-- 时间筛选器 -->
      <div class="time-filter-bar">
        <div class="time-filter-chips">
          <button class="time-chip active" data-range="all" onclick="setTimeFilter('all')">全部</button>
          <button class="time-chip" data-range="today" onclick="setTimeFilter('today')">今天</button>
          <button class="time-chip" data-range="yesterday" onclick="setTimeFilter('yesterday')">昨天</button>
          <button class="time-chip" data-range="week" onclick="setTimeFilter('week')">近7天</button>
          <button class="time-chip" data-range="custom" onclick="setTimeFilter('custom')">自定义</button>
        </div>
        <div class="time-custom-range" id="time-custom-range" style="display:none;">
          <input type="date" id="time-start" class="date-input">
          <span style="color:var(--gray-400);">至</span>
          <input type="date" id="time-end" class="date-input">
          <button class="time-apply-btn" onclick="applyCustomDate()">确定</button>
        </div>
        <div class="time-filter-info" id="time-filter-info"></div>
      </div>
      <div class="filter-bar">
        <select id="t-filter-class"><option value="__all__">全部班级</option></select>
        <button class="btn-export-cls" id="t-btn-export">📥 导出当前班级</button>
        <button class="btn-export-all" id="t-btn-export-all">📥 导出全部</button>
      </div>
      <div style="overflow-x:auto;">
        <table class="student-table" id="teacher-table">
          <thead><tr><th>排名</th><th>姓名</th><th>班级</th><th>答题次数</th><th>最高正确率</th><th>最近正确率</th><th>平均用时</th><th>操作</th></tr></thead>
          <tbody id="teacher-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- Tab: Error Analysis -->
    <div class="card t-tab-panel" id="tab-errors" style="border-radius:0 0 var(--radius) var(--radius);margin-top:0;display:none;">
      <div class="filter-bar">
        <select id="err-filter-class"><option value="__all__">全部班级</option></select>
      </div>
      <div id="error-analysis"></div>
    </div>


    <!-- Tab: Question Management -->
    <div class="card t-tab-panel" id="tab-qmgmt" style="border-radius:0 0 var(--radius) var(--radius);margin-top:0;display:none;">
      <div class="mgmt-toolbar">
        <input type="text" class="search-input" id="q-search" placeholder="🔍 搜索题目..." oninput="renderQuestionMgmt()">
        <select id="q-filter-class" style="padding:10px 14px;border:2px solid var(--gray-200);border-radius:8px;font-size:14px;min-width:100px;" onchange="renderQuestionMgmt()">
          <option value="__all__">全部班级</option>
        </select>
        <button class="mgmt-btn danger" id="q-batch-del" onclick="batchDeleteQuestions()" disabled>🗑️ 批量删除</button>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <label style="font-size:13px;color:var(--gray-500);cursor:pointer;"><input type="checkbox" id="q-select-all" onchange="toggleSelectAllQ()" style="accent-color:var(--primary);margin-right:4px;">全选</label>
        <span id="q-count-info" style="font-size:13px;color:var(--gray-500);"></span>
      </div>
      <div id="q-list"></div>
    </div>

    <!-- Tab: Class Management -->
    <div class="card t-tab-panel" id="tab-cmgmt" style="border-radius:0 0 var(--radius) var(--radius);margin-top:0;display:none;">
      <div class="mgmt-toolbar">
        <button class="mgmt-btn primary" onclick="showAddClassModal()">➕ 新增班级</button>
        <span id="cls-count-info" style="font-size:13px;color:var(--gray-500);"></span>
      </div>
      <div id="cls-list"></div>
    </div>

    <!-- Tab: Import -->
    <div class="card t-tab-panel" id="tab-import" style="border-radius:0 0 var(--radius) var(--radius);margin-top:0;display:none;">
      <!-- Import Students -->
      <div style="margin-bottom:24px;">
        <h3 style="font-size:16px;font-weight:700;margin-bottom:12px;">👥 导入班级学生名单</h3>
        <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
          <button class="import-btn" onclick="downloadTemplate('students')">📄 下载模板</button>
          <label class="import-btn" style="cursor:pointer;">📁 导入Excel/CSV<input type="file" accept=".xlsx,.xls,.csv" style="display:none;" id="file-students" onchange="handleFileImport('students',this)"></label>
          <button class="import-btn" onclick="toggleTextImport('students')">📝 文本导入</button>
        </div>
        <div id="text-import-students" style="display:none;">
          <textarea id="textarea-students" placeholder="每行一条，格式：班级,姓名&#10;例如：&#10;北大,张三&#10;北大,李四&#10;科大,王五" style="width:100%;height:120px;border:2px solid var(--gray-200);border-radius:8px;padding:12px;font-size:14px;font-family:inherit;resize:vertical;"></textarea>
          <button class="import-btn" style="margin-top:8px;background:var(--primary);color:white;" onclick="submitTextImport('students')">✅ 确认导入</button>
        </div>
        <div id="import-status-students" style="font-size:13px;color:var(--gray-500);margin-top:8px;"></div>
      </div>
      <hr style="border:none;border-top:1px solid var(--gray-200);margin:20px 0;">
      <!-- Import Questions -->
      <div>
        <h3 style="font-size:16px;font-weight:700;margin-bottom:12px;">📝 导入题库</h3>
        <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
          <button class="import-btn" onclick="downloadTemplate('questions')">📄 下载模板</button>
          <label class="import-btn" style="cursor:pointer;">📁 导入Excel/CSV<input type="file" accept=".xlsx,.xls,.csv" style="display:none;" id="file-questions" onchange="handleFileImport('questions',this)"></label>
          <button class="import-btn" onclick="toggleTextImport('questions')">📝 文本导入</button>
        </div>
        <div id="text-import-questions" style="display:none;">
          <textarea id="textarea-questions" placeholder="每行一题，格式：班级,题目,A选项,B选项,C选项,答案,解析&#10;例如：&#10;北大,She ____ from Brazil.,am,is,are,B,She是第三人称单数" style="width:100%;height:120px;border:2px solid var(--gray-200);border-radius:8px;padding:12px;font-size:14px;font-family:inherit;resize:vertical;"></textarea>
          <button class="import-btn" style="margin-top:8px;background:var(--primary);color:white;" onclick="submitTextImport('questions')">✅ 确认导入</button>
        </div>
        <div id="import-status-questions" style="font-size:13px;color:var(--gray-500);margin-top:8px;"></div>
      </div>
    </div>

    <div class="card" style="text-align:center;">
      <button class="btn btn-outline" id="t-btn-ranking" style="margin-bottom:0;">🏆 查看排行榜</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modal-detail">
  <div class="modal-box">
    <button class="modal-close" id="modal-close">&times;</button>
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Preload sounds -->
<audio id="snd-success" preload="auto" src="sounds/success.mp3"></audio>
<audio id="snd-fail" preload="auto" src="sounds/fail.mp3"></audio>

<script src="core.js"></script>
<script src="teacher.js"></script>
<script src="manage.js"></script>


<!-- Edit Question Modal -->
<div class="modal-overlay" id="modal-edit-q">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('modal-edit-q')">&times;</button>
    <div class="modal-title" id="edit-q-title">编辑题目</div>
    <div class="form-group"><label>班级</label><input id="eq-class" type="text"></div>
    <div class="form-group"><label>题干</label><textarea id="eq-question" rows="3"></textarea></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div class="form-group"><label>A 选项</label><input id="eq-A" type="text"></div>
      <div class="form-group"><label>B 选项</label><input id="eq-B" type="text"></div>
      <div class="form-group"><label>C 选项</label><input id="eq-C" type="text"></div>
      <div class="form-group"><label>D 选项（可选）</label><input id="eq-D" type="text"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 2fr;gap:12px;">
      <div class="form-group"><label>正确答案</label>
        <select id="eq-answer"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select>
      </div>
      <div class="form-group"><label>解析</label><input id="eq-explanation" type="text"></div>
    </div>
    <div class="form-actions">
      <button class="mgmt-btn" onclick="closeModal('modal-edit-q')">取消</button>
      <button class="mgmt-btn primary" onclick="saveQuestionEdit()">保存</button>
    </div>
  </div>
</div>

<!-- Edit Student Modal -->
<div class="modal-overlay" id="modal-edit-stu">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('modal-edit-stu')">&times;</button>
    <div class="modal-title" id="edit-stu-title">编辑学员</div>
    <div class="form-group"><label>班级</label><input id="es-class" type="text"></div>
    <div class="form-group"><label>姓名</label><input id="es-name" type="text"></div>
    <div class="form-actions">
      <button class="mgmt-btn" onclick="closeModal('modal-edit-stu')">取消</button>
      <button class="mgmt-btn primary" onclick="saveStudentEdit()">保存</button>
    </div>
  </div>
</div>

<!-- Add Class Modal -->
<div class="modal-overlay" id="modal-add-class">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('modal-add-class')">&times;</button>
    <div class="modal-title">新增班级</div>
    <div class="form-group"><label>班级名称</label><input id="ac-name" type="text" placeholder="例如：清华"></div>
    <div class="form-group"><label>学员姓名（每行一个）</label><textarea id="ac-students" rows="5" placeholder="张三
李四
王五"></textarea></div>
    <div class="form-actions">
      <button class="mgmt-btn" onclick="closeModal('modal-add-class')">取消</button>
      <button class="mgmt-btn primary" onclick="saveNewClass()">创建</button>
    </div>
  </div>
</div>

<!-- Confirm Dialog -->
<div id="confirm-dialog" style="display:none;"></div>

<!-- Loading Mask -->
<div id="loading-mask" style="display:none;" class="loading-mask">
  <div class="spinner"></div>
  <p id="loading-mask-text">正在保存...</p>
</div>


<script>
// 加载已保存的 API 配置
(function(){
  var keys=['questions','students','records'];
  var ids=['cfg-questions','cfg-students','cfg-records'];
  keys.forEach(function(k,i){
    var v=localStorage.getItem('quizApi_'+k);
    if(v) document.getElementById(ids[i]).value=v;
  });
})();
function saveApiConfig(){
  var keys=['questions','students','records'];
  var ids=['cfg-questions','cfg-students','cfg-records'];
  keys.forEach(function(k,i){
    var v=document.getElementById(ids[i]).value.trim();
    if(v) localStorage.setItem('quizApi_'+k,v);
    else localStorage.removeItem('quizApi_'+k);
  });
  var m=document.getElementById('cfg-msg');
  m.style.display='inline';
  setTimeout(function(){location.reload();},500);
}
</script>
</body>
</html>
